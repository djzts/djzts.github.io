title: "Zhongqi (Thomas) Zhao"
description: "Academic homepage and blog of Zhongqi (Thomas) Zhao: quantum computing, power system optimization, and energy system management."
url: "https://djzts.github.io"
baseurl: ""
timezone: America/New_York

# Keep the old blog URLs (/2019/08/15/新博客正式开通/) working.
permalink: pretty

collections:
  publications:
    output: true
    permalink: /publications/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
  - scope:
      path: ""
      type: posts
    values:
      layout: post

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

exclude:
  - README.md
  - NEWS_TAGS.md
  - package.json
  - scripts/
  - docs/
  - LICENSE
